<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>نظام توثيق المشاغل التربوية</title>
  <meta http-equiv="refresh"
        content="0; url=https://script.google.com/macros/s/AKfycbyzLKK49tFA_L_y8Uj7EPClyvh_NbHhdNFResK_IbYn1vTvPf-tMZb0dQRq1EUGrPmw/exec">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:18px;background:#f3f7f5;color:#0a5f51;text-align:center;padding:24px;
      font-family:'Tajawal','Segoe UI',system-ui,sans-serif}
    .spin{width:44px;height:44px;border:4px solid #d7e8e2;border-top-color:#0e7a68;
      border-radius:50%;animation:r .9s linear infinite}
    @keyframes r{to{transform:rotate(360deg)}}
    h1{font-size:1.05rem;font-weight:800}
    p{font-size:.9rem;color:#5b6f68;font-weight:600}
    a{display:inline-block;margin-top:6px;background:#0e7a68;color:#fff;text-decoration:none;
      border-radius:10px;padding:11px 24px;font-weight:700;font-size:.95rem}
  </style>
</head>
<body>
  <div class="spin"></div>
  <h1>جارٍ فتح نظام توثيق المشاغل التربوية...</h1>
  <p>إن لم تُفتح الصفحة تلقائياً خلال ثوانٍ، اضغط الزر التالي:</p>
  <a id="go" href="https://script.google.com/macros/s/AKfycbyzLKK49tFA_L_y8Uj7EPClyvh_NbHhdNFResK_IbYn1vTvPf-tMZb0dQRq1EUGrPmw/exec">فتح النظام</a>

  <script>
    var APP_URL = "https://script.google.com/macros/s/AKfycbyzLKK49tFA_L_y8Uj7EPClyvh_NbHhdNFResK_IbYn1vTvPf-tMZb0dQRq1EUGrPmw/exec";
    setTimeout(function () { window.location.replace(APP_URL); }, 300);
  </script>
</body>
</html>
